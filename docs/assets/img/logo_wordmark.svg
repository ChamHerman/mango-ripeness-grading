<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" fill="none">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#14161b"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="amber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="1196" height="196" rx="20" fill="url(#card-grad)" stroke="#2d3139" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="196" rx="20" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Icon Squircle -->
  <rect x="44" y="34" width="132" height="132" rx="30" fill="#21242d" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="44" y="34" width="132" height="132" rx="30" fill="#f59e0b" fill-opacity="0.06"/>

  <!-- Minimal Mango Icon (Scaled 5.5x, centered inside squircle) -->
  <g transform="translate(44, 34) translate(66, 66) scale(5.2) translate(-12, -12)">
    <path d="M12 2C6.5 2 2 6.5 2 12c0 3.5 2 6.5 5 8.5 3 2 7 1.5 10-1.5s5-7 5-10.5C22 5 17.5 2 12 2z" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12 2c1 3 3 5 6 5" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="2" r="1.2" fill="#fbbf24"/>
  </g>

  <!-- Typography: Wordmark Title -->
  <text x="210" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="58" fill="url(#accent-grad)" letter-spacing="-0.8">Mango Ripeness Grading</text>

  <!-- Subtitle Tagline -->
  <text x="214" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#94a3b8" letter-spacing="0.6">Automated Classical Computer Vision &amp; Quality Inspection Suite</text>

  <!-- Status / Accent Badge -->
  <g transform="translate(1008, 44)">
    <rect width="148" height="34" rx="8" fill="#262730" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="18" cy="17" r="4.5" fill="#10b981"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0" letter-spacing="0.2">v2.4.0 • PRODUCTION</text>
  </g>
</svg>